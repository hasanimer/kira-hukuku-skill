name: Paket kontrolü
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Kodlama belirtilmeden açılan metin dosyaları ve alt süreçler hata verir (PEP 597).
      PYTHONWARNDEFAULTENCODING: '1'
      PYTHONWARNINGS: 'error::EncodingWarning'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q scripts tests
      - run: python scripts/validate.py
      - if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -v
      - name: Pyflakes
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.python-version == '3.10' }}
        env:
          # pip'in kendi dosya işlemleri kodlama denetimine takılmasın; denetim yalnız paket kodu içindir.
          PYTHONWARNDEFAULTENCODING: ''
          PYTHONWARNINGS: ''
        run: |
          python -m pip install pyflakes==3.2.0
          python -m pyflakes scripts tests
